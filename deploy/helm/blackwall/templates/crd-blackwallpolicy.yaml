apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blackwallpolicies.security.blackwall.io
  labels:
    app.kubernetes.io/name: blackwall
spec:
  group: security.blackwall.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # IP-based rules
                rules:
                  type: object
                  properties:
                    blocklist:
                      type: array
                      items:
                        type: object
                        properties:
                          ip:
                            type: string
                            pattern: '^(\d{1,3}\.){3}\d{1,3}(/\d{1,2})?$'
                          action:
                            type: string
                            enum: ["drop", "tarpit", "pass"]
                          duration:
                            type: string
                            pattern: '^\d+[smh]$'
                            description: "Block duration (e.g., 10m, 1h, 30s)"
                        required: ["ip", "action"]
                    allowlist:
                      type: array
                      items:
                        type: object
                        properties:
                          ip:
                            type: string
                          reason:
                            type: string
                        required: ["ip"]
                # Anomaly detection thresholds
                thresholds:
                  type: object
                  properties:
                    entropyAnomaly:
                      type: integer
                      minimum: 0
                      maximum: 8000
                      description: "Byte diversity score above which packets are flagged"
                    synFloodRate:
                      type: integer
                      minimum: 0
                      description: "SYN packets per second before triggering protection"
                # Tarpit configuration
                tarpit:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    baseDelayMs:
                      type: integer
                    maxDelayMs:
                      type: integer
                # AI classification
                ai:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    model:
                      type: string
                    fallbackModel:
                      type: string
                # Interface selection (per-node override via nodeSelector)
                network:
                  type: object
                  properties:
                    interface:
                      type: string
                    xdpMode:
                      type: string
                      enum: ["generic", "native", "offload"]
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                appliedNodes:
                  type: integer
                  description: "Number of nodes where policy is active"
                blockedIPs:
                  type: integer
                  description: "Total IPs currently in blocklist across cluster"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Rules
          type: integer
          jsonPath: .status.blockedIPs
        - name: Nodes
          type: integer
          jsonPath: .status.appliedNodes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: blackwallpolicies
    singular: blackwallpolicy
    kind: BlackwallPolicy
    shortNames:
      - bwp
