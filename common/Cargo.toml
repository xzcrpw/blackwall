[package]
name = "common"
version = "0.1.0"
edition = "2021"

[features]
default = ["user", "aya"]
user = ["dep:serde", "dep:serde_json"]
aya = ["dep:aya", "user"]

[dependencies]
aya = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lib]
path = "src/lib.rs"
